apiVersion: apps/v1
kind: Deployment
metadata:
  name: qtransplant-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: qtransplant-frontend
  template:
    metadata:
      labels:
        app: qtransplant-frontend
    spec:
      containers:
      - name: frontend
        image: qtransplant-frontend:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: qtransplant-frontend
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: qtransplant-frontend
