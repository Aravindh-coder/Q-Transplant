apiVersion: apps/v1
kind: Deployment
metadata:
  name: qtransplant-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: qtransplant-backend
  template:
    metadata:
      labels:
        app: qtransplant-backend
    spec:
      containers:
      - name: backend
        image: qtransplant-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "postgresql://qtransplant:SecretPostgresPassword2026!@postgres:5432/qtransplant_db"
        - name: JWT_SECRET
          value: "super-secret-transplant-key-change-in-production-32-bytes-min!"
        - name: ENV
          value: "production"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: qtransplant-backend
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: qtransplant-backend
