# Render Blueprint for Q-Transplant.
#
# This deploys ONE web service that serves both the FastAPI backend and the
# static frontend (public/) from the same origin -- see app/main.py's
# StaticFiles mount and ARCHITECTURE.md's "Deployment" section for why no
# separate static site or CORS configuration is needed for normal use.
#
# Usage: in the Render dashboard, "New +" -> "Blueprint", point it at this
# repo. Render reads this file and provisions the service + database
# together. Secrets marked `sync: false` are NOT set here -- fill them in
# from the Render dashboard after the first deploy (see .env.example in
# backend/backend/ for what each one is and why).

databases:
  - name: qtransplant-db
    plan: free
    databaseName: qtransplant
    user: qtransplant

services:
  - type: web
    name: qtransplant
    runtime: python
    plan: free
    rootDir: backend/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # --- database: wired automatically from the databases block above ---
      - key: DATABASE_URL
        fromDatabase:
          name: qtransplant-db
          property: connectionString

      # --- auth: generated once by Render, stable across deploys ---
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_MINUTES
        value: "720"
      - key: OTP_EXPIRY_MINUTES
        value: "10"
      - key: MIN_PASSWORD_LENGTH
        value: "8"

      # --- organizer email (SMTP sender for OTP + all system emails) ---
      # A Gmail App Password, NOT the account's real login password --
      # https://myaccount.google.com/apppasswords. This is why the earlier
      # security incident (a real app password committed to .env.example)
      # mattered: it's a live credential capable of sending mail as this
      # address, not a throwaway value.
      - key: ORGANIZER_EMAIL
        sync: false
      - key: ORGANIZER_APP_PASSWORD
        sync: false

      # --- first organizer login: set once, redeploy, then rotate/remove
      # the password from this dashboard. Only ever creates the FIRST
      # organizer account -- never overwrites an existing one. ---
      - key: ORGANIZER_BOOTSTRAP_EMAIL
        sync: false
      - key: ORGANIZER_BOOTSTRAP_PASSWORD
        sync: false

      # --- AI-assisted doctor identity verification (both optional) ---
      # If GROQ_API_KEY is set it's used; otherwise ANTHROPIC_API_KEY is
      # used if present. Neither set -> the organizer just reviews the two
      # submitted photos manually -- the app degrades gracefully either way.
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

      # --- document storage: strongly recommended in production ---
      # Render's disk is ephemeral -- without these set, every uploaded
      # document (donor medical reports, doctor certificates, hospital
      # licenses) is lost on the next deploy or restart. Any S3-compatible
      # provider works (AWS S3, Cloudflare R2, Backblaze B2, ...).
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        value: auto

      # --- cors: only needed if something other than this app's own
      # served frontend calls the API from a different origin ---
      - key: ALLOWED_ORIGINS
        value: ""

      # --- rate limiting ---
      - key: LOGIN_RATE_LIMIT
        value: "10"
      - key: OTP_RATE_LIMIT
        value: "5"
      - key: UPLOAD_RATE_LIMIT
        value: "20"
      - key: RATE_LIMIT_WINDOW_MINUTES
        value: "15"
