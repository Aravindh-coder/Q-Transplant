<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q-Transplant — Donor Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--glass:rgba(4,25,34,.56);--line:rgba(98,234,229,.28);--cyan:#62eae5;--red:#ff6471;--amber:#ffc76b;--green:#64e6a4;--text:#f4fbff;--muted:#a9c0c8}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,system-ui;background:#03121a url('q-transplant-bg.svg') center/cover fixed;background-attachment:fixed}body:before{content:"";position:fixed;inset:0;z-index:-1;background:rgba(0,10,16,.12)}button,input,select,textarea{font:inherit}.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 24px 70px rgba(0,0,0,.42);border-radius:18px}.wrap{width:min(1180px,calc(100% - 32px));margin:0 auto}.top{position:sticky;top:12px;z-index:5;margin:12px auto;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}.brand{font:700 18px 'Space Grotesk';display:flex;gap:10px;align-items:center}.dot{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 18px var(--red)}.role{font:600 11px 'JetBrains Mono';color:var(--cyan);border:1px solid var(--line);padding:7px 10px;border-radius:999px}.page{padding:24px 0 60px}.head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin:20px 0}.eyebrow{font:600 10px 'JetBrains Mono';letter-spacing:.12em;color:var(--cyan);text-transform:uppercase}.head h1{font:700 34px 'Space Grotesk';margin:8px 0}.sub{color:var(--muted);line-height:1.55}.grid{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.card{padding:20px}.form{display:grid;gap:12px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font:600 10px 'JetBrains Mono';color:#a8c2ca;text-transform:uppercase;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border-radius:9px;color:#fff;background:rgba(2,18,26,.55);border:1px solid rgba(98,234,229,.2);outline:0}.field textarea{min-height:110px;resize:vertical}.btn{border:1px solid var(--line);background:rgba(98,234,229,.1);color:#fff;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}.btn.primary{color:var(--cyan);background:rgba(98,234,229,.2)}.btn.danger{color:#ffb0b8;border-color:rgba(255,100,113,.35);background:rgba(255,100,113,.1)}.btn.green{color:var(--green);border-color:rgba(100,230,164,.3);background:rgba(100,230,164,.1)}.actions{display:flex;gap:8px;flex-wrap:wrap}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.15);font:600 10px 'JetBrains Mono'}.cyan{color:var(--cyan)}.green{color:var(--green)}.amber{color:var(--amber)}.red{color:var(--red)}.notice{padding:12px;border:1px solid var(--line);background:rgba(98,234,229,.06);border-radius:10px;color:#c9e4e8;font-size:13px}.hidden{display:none!important}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.auth .card{width:min(560px,100%);padding:30px}.tabs{display:flex;gap:7px;margin-bottom:18px}.tabs button{flex:1}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:11px;border-bottom:1px solid rgba(98,234,229,.13);text-align:left}.table th{font:600 10px 'JetBrains Mono';color:#9eb8c1;text-transform:uppercase}.toast{position:fixed;right:20px;bottom:20px;z-index:20;padding:13px 16px;background:rgba(2,18,26,.92);border:1px solid var(--line);border-radius:12px}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button{cursor:pointer}@media(max-width:800px){.g2,.g3,.fields{grid-template-columns:1fr}.head{display:block}}
</style></head>
<body><div id="root"></div><div id="toast" class="toast hidden"></div>
<script>
const API=(localStorage.getItem('qt_api')||'http://localhost:9900').replace(/\/$/,'');
const S={token:localStorage.getItem('qt_token')||'',role:localStorage.getItem('qt_role')||'',email:localStorage.getItem('qt_email')||'',view:location.hash.slice(1)||'home'};
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function toast(m){let e=document.getElementById('toast');e.textContent=m;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),3500)}
async function api(path,opt={}){let h={...(opt.headers||{})};if(S.token)h.Authorization='Bearer '+S.token;if(!(opt.body instanceof FormData))h['Content-Type']='application/json';let r=await fetch(API+path,{...opt,headers:h});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.detail||'Request failed');return d}
function go(v){S.view=v;location.hash=v;render()}
function logout(){localStorage.removeItem('qt_token');localStorage.removeItem('qt_role');S.token='';S.role='';go('login')}
function auth(){return `<div class="auth"><div class="glass card"><div class="brand"><span class="dot"></span>Q-TRANSPLANT</div><div class="eyebrow" style="margin-top:24px">DONOR REGISTRATION</div><h1 style="font-family:'Space Grotesk'">Create your donor account</h1><div class="tabs"><button class="btn primary" onclick="showAuth('register')">Register</button><button class="btn" onclick="showAuth('login')">Login</button></div><div id="authbox"></div></div></div>`}
function showAuth(mode){let b=document.getElementById('authbox');if(!b)return; b.innerHTML=mode==='register'?`<form class="form" onsubmit="registerDo(event)"><div class="fields"><div class="field"><label>Full name</label><input id="rname" required></div><div class="field"><label>Email</label><input id="remail" type="email" required></div><div class="field"><label>Password</label><input id="rpass" type="password" minlength="8" required></div><div class="field"><label>Blood group</label><select id="rblood" required>${['O+','A+','B+','AB+','O-','A-','B-','AB-'].map(x=>`<option>${x}</option>`).join('')}</select></div></div><button class="btn primary">Create account &amp; send OTP</button></form>`:`<form class="form" onsubmit="loginDo(event)"><div class="field"><label>Email</label><input id="lemail" type="email" required></div><div class="field"><label>Password</label><input id="lpass" type="password" required></div><button class="btn primary">Login</button></form><div class="notice" style="margin-top:12px">Donor login requires email verification. If you registered but did not receive the OTP, use the verification screen below.</div>`}
async function registerDo(e){e.preventDefault();try{let email=document.getElementById('remail').value;await api('/api/v1/auth/register',{method:'POST',body:JSON.stringify({role:'donor',email,password:document.getElementById('rpass').value,full_name:document.getElementById('rname').value,blood_group:document.getElementById('rblood').value})});localStorage.setItem('qt_verify_email',email);S.email=email;go('verify')}catch(x){toast(x.message)}}
async function loginDo(e){e.preventDefault();try{let email=document.getElementById('lemail').value;let d=await api('/api/v1/auth/login',{method:'POST',body:JSON.stringify({email,password:document.getElementById('lpass').value})});if(d.role!=='donor')throw Error('This portal is only for donors.');S.token=d.access_token;S.role=d.role;S.email=email;localStorage.setItem('qt_token',S.token);localStorage.setItem('qt_role',S.role);localStorage.setItem('qt_email',S.email);go('home')}catch(x){toast(x.message)}}
function verify(){let email=localStorage.getItem('qt_verify_email')||S.email;return `<div class="auth"><div class="glass card"><div class="brand"><span class="dot"></span>Q-TRANSPLANT</div><div class="eyebrow" style="margin-top:24px">EMAIL VERIFICATION</div><h1 style="font-family:'Space Grotesk'">Enter your 6-digit OTP</h1><p class="sub">We sent a verification code to <b>${esc(email)}</b>. The code expires according to the server OTP policy.</p><form class="form" onsubmit="verifyDo(event)"><div class="field"><label>OTP</label><input id="votp" inputmode="numeric" maxlength="6" required></div><button class="btn primary">Verify email</button></form><button class="btn" style="margin-top:10px" onclick="resendDo()">Resend OTP</button><button class="btn" style="margin-top:10px" onclick="go('login')">Back to login</button></div></div>`}
async function verifyDo(e){e.preventDefault();try{let email=localStorage.getItem('qt_verify_email')||S.email;await api('/api/v1/auth/verify-email',{method:'POST',body:JSON.stringify({email,otp:document.getElementById('votp').value})});localStorage.removeItem('qt_verify_email');toast('Email verified. You can now log in.');go('login')}catch(x){toast(x.message)}}
async function resendDo(){try{let email=localStorage.getItem('qt_verify_email')||S.email;await api('/api/v1/auth/resend-verification',{method:'POST',body:JSON.stringify({email})});toast('If the account is unverified, a new OTP was sent.')}catch(x){toast(x.message)}}
function shell(content){return `<div class="wrap"><header class="glass top"><div class="brand"><span class="dot"></span>Q-TRANSPLANT</div><div class="nav"><button class="btn" onclick="go('home')">Dashboard</button><button class="btn" onclick="go('profile')">Profile</button><button class="btn" onclick="go('status')">Donation status</button><button class="btn" onclick="go('requests')">Requests</button><button class="btn" onclick="go('documents')">Documents</button><button class="btn" onclick="go('notifications')">Notifications</button><button class="btn danger" onclick="logout()">Sign out</button></div></header><main class="page">${content}</main></div>`}
async function home(){let p=await api('/api/v1/donors/me');let s=await api('/api/v1/donors/me/status');return shell(`<div class="head"><div><div class="eyebrow">DONOR PORTAL</div><h1>Welcome, ${esc((await api('/api/v1/auth/me')).email)}</h1><div class="sub">Your portal only exposes your own donor data, requests, documents and notifications.</div></div></div><div class="grid g3"><div class="glass card"><div class="eyebrow">AVAILABILITY</div><h2>${esc(s.availability_status)}</h2><button class="btn ${s.availability_status==='active'?'danger':'green'}" onclick="toggleAvailability(${s.availability_status==='active'?'false':'true'})">Set ${s.availability_status==='active'?'inactive':'active'}</button></div><div class="glass card"><div class="eyebrow">DONATION STATUS</div><h2>${esc(s.donation_status)}</h2><p class="sub">Medical personnel control the clinical donation workflow status.</p></div><div class="glass card"><div class="eyebrow">VERIFICATION</div><h2>${esc(s.verification_status)}</h2><p class="sub">Profile and medical-document verification are managed by authorized personnel.</p></div></div><div class="glass card" style="margin-top:16px"><div class="eyebrow">PROFILE SNAPSHOT</div><div class="grid g2" style="margin-top:12px"><div><b>Blood group:</b> ${esc(p.blood_group)}</div><div><b>Organs:</b> ${esc((p.organs_available||[]).join(', ')||'Not provided')}</div><div><b>DOB:</b> ${esc(p.date_of_birth||'Not provided')}</div><div><b>Phone:</b> ${esc(p.phone||'Not provided')}</div></div></div>`)}
async function toggleAvailability(active){try{await api('/api/v1/donors/me/availability?active='+active,{method:'POST'});render()}catch(x){toast(x.message)}}
function profile(){return shell(`<div class="head"><div><div class="eyebrow">DONOR PROFILE</div><h1>Your medical profile</h1><div class="sub">Complete all fields you are comfortable providing. Only authorized medical/coordination roles can access donor matching data.</div></div></div><div class="glass card"><form class="form" onsubmit="profileDo(event)"><div class="fields"><div class="field"><label>Date of birth</label><input id="dob"></div><div class="field"><label>Gender</label><select id="gender"><option value="">Select</option><option>Female</option><option>Male</option><option>Other</option></select></div><div class="field"><label>Phone</label><input id="phone"></div><div class="field"><label>Blood group</label><select id="blood">${['O+','A+','B+','AB+','O-','A-','B-','AB-'].map(x=>`<option>${x}</option>`).join('')}</select></div></div><div class="field"><label>Address</label><textarea id="address"></textarea></div><div class="field"><label>Available organs</label><input id="organs" placeholder="Kidney, Liver, Heart"></div><div class="eyebrow">HLA TYPING</div><div class="fields"><div class="field"><label>HLA-A</label><input id="hla_a"></div><div class="field"><label>HLA-B</label><input id="hla_b"></div><div class="field"><label>HLA-C</label><input id="hla_c"></div><div class="field"><label>HLA-DR</label><input id="hla_dr"></div><div class="field"><label>HLA-DQ</label><input id="hla_dq"></div></div><div class="field"><label>Medical information</label><textarea id="medical" placeholder="Relevant medical history, conditions, medications, procedures, etc."></textarea></div><button class="btn primary">Save donor profile</button></form></div><div id="profileloaded"></div>`)}
async function profileDo(e){e.preventDefault();try{let d={date_of_birth:dob.value,gender:gender.value,phone:phone.value,address:address.value,blood_group:blood.value,organs_available:organs.value.split(',').map(x=>x.trim()).filter(Boolean),hla_a:hla_a.value,hla_b:hla_b.value,hla_c:hla_c.value,hla_dr:hla_dr.value,hla_dq:hla_dq.value,medical_information:medical.value};await api('/api/v1/donors/me',{method:'PUT',body:JSON.stringify(d)});toast('Profile saved.');await loadProfile();}catch(x){toast(x.message)}}
async function loadProfile(){try{let p=await api('/api/v1/donors/me');for(let [id,v] of Object.entries({dob:p.date_of_birth||'',gender:p.gender||'',phone:p.phone||'',address:p.address||'',blood:p.blood_group||'O+',organs:(p.organs_available||[]).join(', '),hla_a:p.hla_a||'',hla_b:p.hla_b||'',hla_c:p.hla_c||'',hla_dr:p.hla_dr||'',hla_dq:p.hla_dq||'',medical:p.medical_information||''})){let e=document.getElementById(id);if(e)e.value=v}}catch(x){toast(x.message)}}
async function status(){let s=await api('/api/v1/donors/me/status');return shell(`<div class="head"><div><div class="eyebrow">DONATION WORKFLOW</div><h1>Status tracking</h1><div class="sub">Your clinical donation status can move through the approved workflow. You can control availability, while clinical statuses are controlled by authorized personnel.</div></div></div><div class="grid g2"><div class="glass card"><div class="eyebrow">CURRENT STATUS</div><h2>${esc(s.donation_status)}</h2><p class="sub">Workflow: ACTIVE → UNDER REVIEW → MATCHED → DONATION IN PROCESS → COMPLETED. INACTIVE is used when you are unavailable.</p></div><div class="glass card"><div class="eyebrow">AVAILABILITY</div><h2>${esc(s.availability_status)}</h2><button class="btn" onclick="toggleAvailability(${s.availability_status!=='active'})">Set ${s.availability_status==='active'?'inactive':'active'}</button></div></div>`)}
async function requests(){let rows=await api('/api/v1/donor-requests/me');return shell(`<div class="head"><div><div class="eyebrow">AUTHORIZED REQUESTS</div><h1>Donation requests</h1><div class="sub">Requests come only from authorized doctors or hospitals. No patient medical records are exposed here.</div></div></div><div class="grid">${rows.length?rows.map(r=>`<div class="glass card"><div class="actions" style="justify-content:space-between"><span class="badge ${r.urgency==='CRITICAL'||r.urgency==='EMERGENCY'?'red':'amber'}">${esc(r.urgency)}</span><span class="badge">${esc(r.status)}</span></div><h2>${esc(r.organ)} request</h2><p class="sub">Requested by <b>${esc(r.requested_by.name)}</b> (${esc(r.requested_by.role)})</p><p>${esc(r.message||'No additional message.')}</p>${r.status==='pending'?`<div class="actions"><button class="btn green" onclick="respond('${r.id}','accepted')">Accept</button><button class="btn danger" onclick="respond('${r.id}','declined')">Decline</button></div>`:''}</div>`).join(''):`<div class="glass card"><p class="sub">No donation requests yet.</p></div>`}</div>`)}
async function respond(id,decision){if(!confirm(`Are you sure you want to ${decision} this request?`))return;try{await api('/api/v1/donor-requests/'+id+'/respond',{method:'POST',body:JSON.stringify({decision})});toast('Request updated.');render()}catch(x){toast(x.message)}}
function documents(){return shell(`<div class="head"><div><div class="eyebrow">MEDICAL DOCUMENTS</div><h1>Secure document vault</h1><div class="sub">Upload your required documents. Files are stored privately and are not exposed as public URLs.</div></div></div><div class="grid g2"><div class="glass card"><form class="form" onsubmit="uploadDoc(event)"><div class="field"><label>Document type</label><select id="dtype"><option value="id_proof">Government ID</option><option value="medical_report">Medical report</option><option value="blood_group_report">Blood-group report</option><option value="hla_typing">HLA typing report</option><option value="other">Other medical document</option></select></div><div class="field"><label>File</label><input id="dfile" type="file" accept=".pdf,.png,.jpg,.jpeg" required></div><button class="btn primary">Upload securely</button></form></div><div class="glass card" id="doclist"><p class="sub">Loading documents…</p></div></div>`)}
async function uploadDoc(e){e.preventDefault();try{let f=document.getElementById('dfile').files[0],fd=new FormData();fd.append('kind',document.getElementById('dtype').value);fd.append('file',f);await api('/api/v1/documents',{method:'POST',body:fd});toast('Document uploaded.');await loadDocs()}catch(x){toast(x.message)}}
async function loadDocs(){try{let rows=await api('/api/v1/donors/me/documents');let e=document.getElementById('doclist');if(!e)return;e.innerHTML='<div class="eyebrow">YOUR DOCUMENTS</div>'+ (rows.length?`<table class="table"><tr><th>Type</th><th>File</th><th>Status</th></tr>${rows.map(d=>`<tr><td>${esc(d.kind)}</td><td>${esc(d.filename)}</td><td>${esc(d.verification_status)}</td></tr>`).join('')}</table>`:'<p class="sub">No documents uploaded.</p>')}catch(x){toast(x.message)}}
async function notifications(){let rows=await api('/api/v1/notifications/me');return shell(`<div class="head"><div><div class="eyebrow">NOTIFICATIONS</div><h1>Your notifications</h1><div class="sub">In-app alerts and request updates for your account.</div></div></div><div class="grid">${rows.length?rows.map(n=>`<div class="glass card"><div class="actions" style="justify-content:space-between"><b>${esc(n.title)}</b><span class="badge">${esc(n.priority)}</span></div><p>${esc(n.message)}</p><div class="sub">${esc(n.created_at)}</div>${!n.read?`<button class="btn" style="margin-top:8px" onclick="readN('${n.id}')">Mark read</button>`:''}</div>`).join(''):'<div class="glass card"><p class="sub">No notifications.</p></div>'}</div>`)}
async function readN(id){try{await api('/api/v1/notifications/'+id+'/read',{method:'POST'});render()}catch(x){toast(x.message)}}
async function render(){let root=document.getElementById('root');if(!S.token||S.role!=='donor'){root.innerHTML=S.view==='verify'?verify():auth();if(S.view!=='verify')showAuth('login');return}try{let c=S.view==='home'?await home():S.view==='profile'?profile():S.view==='status'?await status():S.view==='requests'?await requests():S.view==='documents'?documents():S.view==='notifications'?await notifications():await home();root.innerHTML=c;if(S.view==='profile')await loadProfile();if(S.view==='documents')await loadDocs()}catch(x){root.innerHTML=shell(`<div class="glass card"><h2>Unable to load portal</h2><p class="sub">${esc(x.message)}</p><button class="btn" onclick="logout()">Sign out</button></div>`)}}
render();
</script></body></html>
