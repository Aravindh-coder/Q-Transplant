<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q-Transplant — Coordination Console</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"><style>
:root{--glass:rgba(4,25,34,.58);--glass2:rgba(7,37,48,.72);--line:rgba(98,234,229,.25);--cyan:#62eae5;--red:#ff6471;--amber:#ffc76b;--green:#64e6a4;--text:#f4fbff;--muted:#a9c0c8;--shadow:0 24px 70px rgba(0,0,0,.42)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui;color:var(--text);background:#03121a}body{background:linear-gradient(rgba(0,12,18,.18),rgba(0,12,18,.24)),url('q-transplant-bg.svg') center/cover fixed;background-attachment:fixed}body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 50% 30%,rgba(98,234,229,.08),transparent 45%)}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}.mono{font-family:'JetBrains Mono',monospace}.shell{min-height:100vh;display:flex}.sidebar{width:255px;position:fixed;left:0;top:0;bottom:0;padding:22px 16px;background:rgba(2,18,26,.55);border-right:1px solid var(--line);backdrop-filter:blur(18px);z-index:20;overflow:auto}.brand{display:flex;align-items:center;gap:10px;font:700 18px 'Space Grotesk';margin:4px 8px 28px}.dot{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 20px var(--red)}.role-pill{font:600 11px 'JetBrains Mono';letter-spacing:.08em;color:var(--cyan);border:1px solid var(--line);background:rgba(98,234,229,.08);padding:7px 9px;border-radius:999px;display:inline-block;margin:0 8px 18px;text-transform:uppercase}nav{display:grid;gap:5px}.nav{padding:11px 12px;border-radius:10px;color:#b5cbd2;border:1px solid transparent;cursor:pointer}.nav:hover,.nav.active{background:rgba(98,234,229,.1);border-color:var(--line);color:#fff}.main{margin-left:255px;width:calc(100% - 255px);min-height:100vh}.top{position:sticky;top:0;z-index:15;padding:14px 28px;background:rgba(2,18,26,.4);border-bottom:1px solid var(--line);backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:space-between}.route{font:600 12px 'JetBrains Mono';color:var(--cyan)}.content{padding:28px;max-width:1450px;margin:auto}.glass{background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:18px}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:22px}.eyebrow{font:600 10px 'JetBrains Mono';letter-spacing:.12em;color:var(--cyan);text-transform:uppercase}.page-head h1{font:700 32px 'Space Grotesk';margin:8px 0 5px}.sub{color:var(--muted);font-size:14px;line-height:1.55}.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{padding:20px}.stat{font:700 30px 'Space Grotesk';margin-top:8px}.stat-label{font:600 11px 'JetBrains Mono';color:#a5c1c9;text-transform:uppercase;letter-spacing:.06em}.stat.cyan{color:var(--cyan)}.stat.red{color:var(--red)}.stat.amber{color:var(--amber)}.stat.green{color:var(--green)}.btn{border:1px solid var(--line);background:rgba(98,234,229,.1);color:#fff;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}.btn:hover{background:rgba(98,234,229,.18);border-color:var(--cyan)}.btn.primary{background:rgba(98,234,229,.2);color:var(--cyan)}.btn.danger{background:rgba(255,100,113,.12);border-color:rgba(255,100,113,.35);color:#ffb0b8}.btn.ghost{background:rgba(255,255,255,.04)}.btn:disabled{opacity:.45;cursor:not-allowed}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:12px;border-bottom:1px solid rgba(98,234,229,.13);text-align:left;white-space:nowrap}.table th{font:600 10px 'JetBrains Mono';color:#9eb8c1;text-transform:uppercase}.table tr:hover td{background:rgba(98,234,229,.04)}.badge{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;font:600 10px 'JetBrains Mono';border:1px solid rgba(255,255,255,.15)}.b-green{color:var(--green);border-color:rgba(100,230,164,.3);background:rgba(100,230,164,.08)}.b-red{color:var(--red);border-color:rgba(255,100,113,.3);background:rgba(255,100,113,.08)}.b-amber{color:var(--amber);border-color:rgba(255,199,107,.3);background:rgba(255,199,107,.08)}.b-cyan{color:var(--cyan);border-color:var(--line);background:rgba(98,234,229,.08)}.form{display:grid;gap:13px}.field label{display:block;font:600 10px 'JetBrains Mono';color:#a8c2ca;text-transform:uppercase;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;background:rgba(2,18,26,.48);border:1px solid rgba(98,234,229,.2);border-radius:9px;padding:11px;color:#fff;outline:none}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(98,234,229,.07)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.form-grid.five{grid-template-columns:repeat(5,minmax(0,1fr))}.actions{display:flex;gap:8px;flex-wrap:wrap}.notice{padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:rgba(98,234,229,.07);color:#c9e4e8;font-size:13px}.notice.warn{border-color:rgba(255,199,107,.3);background:rgba(255,199,107,.07)}.notice.error{border-color:rgba(255,100,113,.3);background:rgba(255,100,113,.07)}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(650px,100%);padding:30px}.tabs{display:flex;gap:6px;margin:18px 0}.tabs button{flex:1}.center{text-align:center}.hidden{display:none!important}.toast{position:fixed;right:22px;bottom:22px;z-index:50;max-width:380px;padding:13px 16px;border:1px solid var(--line);background:rgba(2,18,26,.86);backdrop-filter:blur(16px);border-radius:12px;box-shadow:var(--shadow)}@media(max-width:1050px){.sidebar{width:210px}.main{margin-left:210px;width:calc(100% - 210px)}.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}@media(max-width:760px){.sidebar{position:static;width:100%;height:auto}.shell{display:block}.main{margin:0;width:100%}.g2,.g3,.g4,.form-grid,.form-grid.three,.form-grid.five{grid-template-columns:1fr}.content{padding:16px}.page-head{display:block}.top{padding:12px 16px}}
</style></head><body><div id="root"></div><div id="toast" class="toast hidden"></div><script>
const API=(localStorage.getItem('qt_api')||'').replace(/\/$/,'');const organs=['Kidney','Liver','Heart','Lung','Pancreas','Intestine'],urgency=['LOW','MEDIUM','HIGH','CRITICAL','EMERGENCY'];const state={token:localStorage.getItem('qt_token')||'',role:localStorage.getItem('qt_role')||'',user:null,path:location.hash.slice(1)||'login'};const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const toast=m=>{const e=document.getElementById('toast');e.textContent=m;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),3000)};async function api(p,o={},timeoutMs=15000){const h={'Content-Type':'application/json',...(o.headers||{})};if(state.token)h.Authorization='Bearer '+state.token;const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),timeoutMs);let r;try{r=await fetch(API+p,{...o,headers:h,signal:ctrl.signal})}catch(e){if(e.name==='AbortError')throw Error('Server is waking up, please retry in a moment.');throw Error('Network error — could not reach the server.')}finally{clearTimeout(t)}let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.detail||d.message||'Request failed');return d}async function act(f){try{return await f()}catch(e){toast(e.message);throw e}}function go(p){state.path=p;location.hash=p;render()}function logout(){localStorage.removeItem('qt_token');localStorage.removeItem('qt_role');state.token='';state.role='';go('login')}function opts(a){return a.map(x=>`<option value="${x}">${x}</option>`).join('')}function navItems(){if(state.role==='donor')return[['donor','Dashboard'],['donor/profile','Profile'],['donor/status','Donation status']];if(state.role==='doctor')return[['doctor','Dashboard'],['doctor/profile','Profile'],['doctor/patients','Patients'],['doctor/donors','Donors'],['doctor/matching','Matching'],['doctor/emergency','Emergency']];if(state.role==='hospital')return[['hospital','Dashboard'],['hospital/profile','Profile'],['hospital/doctors','Doctors'],['hospital/patients','Patients'],['hospital/matching','Matching'],['hospital/emergency','Emergency']];if(state.role==='organizer')return[['organizer','Dashboard'],['organizer/users','Users'],['organizer/doctors','Doctors'],['organizer/approvals','Approvals'],['organizer/hospitals','Hospitals'],['organizer/donors','Donors'],['organizer/patients','Patients'],['organizer/matches','Matches'],['organizer/emergency','Emergency'],['organizer/devices','Devices'],['organizer/audit','Audit log']];return[]}function shell(x){return`<div class="shell"><aside class="sidebar"><div class="brand"><span class="dot"></span>Q-TRANSPLANT</div><span class="role-pill">${esc(state.role||'secure console')}</span><nav>${navItems().map(([p,l])=>`<div class="nav ${state.path===p?'active':''}" onclick="go('${p}')">${l}</div>`).join('')}</nav><div style="margin-top:25px"><button class="btn ghost" style="width:100%" onclick="logout()">Sign out</button></div></aside><main class="main"><header class="top"><span class="route">/ ${esc(state.path)}</span><span class="badge b-cyan">${esc(state.user?.email||state.role)}</span></header><section class="content">${x}</section></main></div>`}function head(k,t,s,a=''){return`<div class="page-head"><div><div class="eyebrow">${k}</div><h1>${t}</h1><div class="sub">${s}</div></div><div class="actions">${a}</div></div>`}function stat(l,v,c='cyan'){return`<div class="glass card"><div class="stat-label">${l}</div><div class="stat ${c}">${esc(v)}</div></div>`}function login(){return`<div class="login"><div class="glass login-card" style="max-width:460px"><div class="brand"><span class="dot"></span>Q-TRANSPLANT</div><div class="eyebrow">SECURE ACCESS</div><h1>Coordination Console</h1><p class="sub">Authorized role portals with JWT authentication and backend-controlled medical access.</p><form class="form" onsubmit="loginDo(event)"><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div><button class="btn primary">Sign in</button></form><div class="tabs"><button class="btn ghost" onclick="go('register/doctor')">Doctor</button><button class="btn ghost" onclick="go('register/donor')">Donor</button><button class="btn ghost" onclick="go('register/hospital')">Hospital</button></div><button class="btn ghost" style="width:100%" onclick="go('forgot')">Forgot password / OTP</button></div></div>`}function registerPage(r){return`<div class="login"><div class="glass login-card"><div class="brand"><span class="dot"></span>Q-TRANSPLANT</div><div class="eyebrow">${r.toUpperCase()} REGISTRATION</div><h1>Create ${r} account</h1><form class="form" onsubmit="regDo(event,'${r}')"><div class="form-grid"><div class="field"><label>Full name</label><input id="rname" required></div><div class="field"><label>Email</label><input id="remail" type="email" required></div><div class="field"><label>Mobile</label><input id="rphone"></div><div class="field"><label>Password</label><input id="rpass" type="password" minlength="8" required></div></div>${r==='doctor'?`<div class="form-grid"><div class="field"><label>License / registration</label><input id="license" required></div><div class="field"><label>Specialty</label><input id="specialty"></div><div class="field"><label>Hospital ID</label><input id="hospitalid"></div></div><div class="notice warn">Doctor access stays pending until organizer approval.</div>`:''}${r==='hospital'?`<div class="form-grid"><div class="field"><label>Hospital name</label><input id="hname" required></div><div class="field"><label>Hospital ID / code</label><input id="hcode" required></div></div>`:''}${r==='donor'?`<div class="field"><label>Blood group</label><select id="blood" required>${opts(['O+','A+','B+','AB+','O-','A-','B-','AB-'])}</select></div>`:''}<div class="actions"><button class="btn primary">Register</button><button type="button" class="btn ghost" onclick="go('login')">Back</button></div></form></div></div>`}function forgot(){return`<div class="login"><div class="glass login-card" style="max-width:460px"><div class="eyebrow">ACCOUNT RECOVERY</div><h1>OTP password reset</h1><form class="form" onsubmit="otpReq(event)"><div class="field"><label>Registered email</label><input id="femail" type="email" required></div><button class="btn primary">Send 6-digit OTP</button></form><form class="form" style="margin-top:18px" onsubmit="otpReset(event)"><div class="field"><label>OTP</label><input id="otp" maxlength="6" required></div><div class="field"><label>New password</label><input id="newpass" type="password" minlength="8" required></div><button class="btn">Set new password</button></form><button class="btn ghost" style="margin-top:10px;width:100%" onclick="go('login')">Back</button></div></div>`}async function loginDo(e){e.preventDefault();await act(async()=>{const d=await api('/api/v1/auth/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});state.token=d.access_token;state.role=d.role;localStorage.setItem('qt_token',state.token);localStorage.setItem('qt_role',state.role);state.user=await api('/api/v1/auth/me');go(state.role)})}async function regDo(e,r){e.preventDefault();const b={email:remail.value,password:rpass.value,role:r,full_name:rname.value};if(r==='doctor')Object.assign(b,{license_number:license.value,specialty:specialty.value,hospital_id:hospitalid.value||null});if(r==='hospital')Object.assign(b,{hospital_name:hname.value,hospital_code:hcode.value});if(r==='donor')b.blood_group=blood.value;await act(async()=>{await api('/api/v1/auth/register',{method:'POST',body:JSON.stringify(b)});toast('Registration successful');go('login')})}async function otpReq(e){e.preventDefault();await act(async()=>{await api('/api/v1/auth/forgot-password',{method:'POST',body:JSON.stringify({email:femail.value})});toast('If the account exists, an OTP was sent.')})}async function otpReset(e){e.preventDefault();await act(async()=>{await api('/api/v1/auth/reset-password',{method:'POST',body:JSON.stringify({email:femail.value,otp:otp.value,new_password:newpass.value})});toast('Password changed');go('login')})}function render(){const r=document.getElementById('root');if(!state.token&&!['login','forgot'].includes(state.path)&&!state.path.startsWith('register/'))return r.innerHTML=login();if(state.path==='login')return r.innerHTML=login();if(state.path==='forgot')return r.innerHTML=forgot();if(state.path.startsWith('register/'))return r.innerHTML=registerPage(state.path.split('/')[1]);r.innerHTML=shell('<div class="glass card center"><div class="eyebrow">LOADING</div><p class="sub">Synchronizing authorized records…</p></div>');route()}async function route(){try{const p=state.path;let x;if(p.startsWith('donor'))x=await donor(p);else if(p.startsWith('doctor'))x=await doctor(p);else if(p.startsWith('hospital'))x=await hospital(p);else if(p.startsWith('organizer'))x=await organizer(p);else x=home();document.getElementById('root').innerHTML=shell(x)}catch(e){document.getElementById('root').innerHTML=shell(`<div class="notice error">${esc(e.message)}</div>`)}}function home(){return`${head('PLATFORM','Q-Transplant','Intelligent organ-transplant coordination with deterministic compatibility, explainable ranking, emergency communication and secure role portals.')}<div class="grid g3">${stat('Role',state.role)}${stat('Authentication','JWT active','green')}${stat('Clinical authority','Professional review','amber')}</div><div class="glass card" style="margin-top:16px"><div class="eyebrow">MEDICAL SAFETY</div><h3>Decision support only</h3><p class="sub">The system provides compatibility information, ranking, explanations and warnings. It does not independently decide whether a transplant is medically safe.</p></div>`}async function donor(p){const d=await api('/api/v1/donors/me').catch(()=>({}));if(p==='donor/profile')return`${head('DONOR PROFILE','Your donor profile','Structured donation and HLA information.')}<div class="glass card"><form class="form" onsubmit="donorSave(event)"><div class="form-grid three"><div class="field"><label>Date of birth</label><input id="dob" value="${esc(d.date_of_birth)}"></div><div class="field"><label>Gender</label><input id="gender" value="${esc(d.gender)}"></div><div class="field"><label>Phone</label><input id="dphone" value="${esc(d.phone)}"></div><div class="field"><label>Blood group</label><select id="dbg">${opts(['O+','A+','B+','AB+','O-','A-','B-','AB-'])}</select></div><div class="field"><label>Address</label><input id="address" value="${esc(d.address)}"></div><div class="field"><label>Organs available</label><select id="organs" multiple size="4">${opts(organs)}</select></div></div><div class="eyebrow">HLA PROFILE</div><div class="form-grid five">${['a','b','c','dr','dq'].map(x=>`<div class="field"><label>HLA-${x.toUpperCase()}</label><input id="h${x}" value="${esc(d['hla_'+x])}"></div>`).join('')}</div><button class="btn primary">Save profile</button></form></div>`;if(p==='donor/status')return`${head('DONOR STATUS','Donation availability','Your active/inactive status and verification state.')}<div class="grid g3">${stat('Availability',d.availability_status||'pending',d.availability_status==='active'?'green':'amber')}${stat('Verification',d.verification_status||'pending','cyan')}${stat('Organs',(d.organs_available||[]).length,'amber')}</div><div class="glass card" style="margin-top:16px"><button class="btn primary" onclick="donorAvail(true)">Set active</button> <button class="btn danger" onclick="donorAvail(false)">Set inactive</button></div>`;return`${head('DONOR PORTAL','Donation dashboard','Manage your profile and availability.')}<div class="grid g3">${stat('Availability',d.availability_status||'pending','green')}${stat('Verification',d.verification_status||'pending','cyan')}${stat('Available organs',(d.organs_available||[]).length,'amber')}</div>`}async function donorSave(e){e.preventDefault();await act(async()=>{await api('/api/v1/donors/me',{method:'PUT',body:JSON.stringify({date_of_birth:dob.value,gender:gender.value,phone:dphone.value,address:address.value,blood_group:dbg.value,organs_available:[...organs.selectedOptions].map(x=>x.value.toLowerCase()),hla_a:ha.value,hla_b:hb.value,hla_c:hc.value,hla_dr:hdr.value,hla_dq:hdq.value})});toast('Saved')})}async function donorAvail(a){await act(async()=>{await api('/api/v1/donors/me/availability?active='+a,{method:'POST'});go('donor/status')})}async function doctor(p){if(p==='doctor/profile'){const d=await api('/api/v1/doctors/me');return`${head('DOCTOR PROFILE','Professional profile','License, specialty and hospital linkage.')}<div class="glass card"><form class="form" onsubmit="docSave(event)"><div class="form-grid"><div class="field"><label>Phone</label><input id="dp" value="${esc(d.phone)}"></div><div class="field"><label>Address</label><input id="da" value="${esc(d.address)}"></div><div class="field"><label>License</label><input id="dl" value="${esc(d.license_number)}" required></div><div class="field"><label>Specialty</label><input id="ds" value="${esc(d.specialty)}"></div><div class="field"><label>Hospital ID</label><input id="dh" value="${esc(d.hospital_id)}"></div></div><div class="notice">Approval: <span class="badge ${d.approval_status==='approved'?'b-green':'b-amber'}">${esc(d.approval_status)}</span></div><button class="btn primary">Save</button></form></div>`}if(p==='doctor/patients'){const ps=await api('/api/v1/patients');return`${head('PATIENTS','Recipient records','Create and review patients in your authorized hospital workflow.','<button class="btn primary" onclick="patientForm.classList.toggle(\'hidden\')">+ Add patient</button>')}<div id="patientForm" class="glass card hidden" style="margin-bottom:16px">${pf()}</div>${pt(ps)}`}if(p==='doctor/donors'){const ds=await api('/api/v1/donors/search');return`${head('DONOR POOL','Authorized donors','Active donors available for authorized clinical users.')}<div class="glass card table-wrap">${dt(ds)}</div>`}if(p==='doctor/matching'){const ps=await api('/api/v1/patients');return`${head('MATCHING ENGINE','Compatibility & ranking','Deterministic compatibility first; ranked candidates and explanations second.')}<div class="glass card"><div class="field"><label>Patient</label><select id="matchPatient">${ps.map(x=>`<option value="${x.id}">${esc(x.full_name)} — ${esc(x.required_organ)} — ${esc(x.urgency)}</option>`).join('')}</select></div><button class="btn primary" onclick="matchRun()">Run compatibility analysis</button></div><div id="matchResults" style="margin-top:16px"></div><div class="glass card" style="margin-top:16px"><div class="eyebrow">QUANTUM RESEARCH MODULE</div><p class="sub">Experimental quantum-inspired search is isolated from clinical rules and must be benchmarked rather than claimed as a real quantum speedup.</p><button class="btn" onclick="bench()">Run benchmark</button><div id="benchOut"></div></div>`}if(p==='doctor/emergency')return emergency();const ps=await api('/api/v1/patients');return`${head('DOCTOR CONSOLE','Clinical coordination','Patient priority, donor search, matching and emergency controls.')}<div class="grid g4">${stat('Patients',ps.length)}${stat('Critical / emergency',ps.filter(x=>['CRITICAL','EMERGENCY'].includes(x.urgency)).length,'red')}${stat('Waiting',ps.filter(x=>x.waitlist_status==='waiting').length,'amber')}${stat('Rules','Backend authoritative','green')}</div>`}function pf(){return`<form class="form" onsubmit="patientCreate(event)"><div class="form-grid three"><div class="field"><label>Full name</label><input id="pn" required></div><div class="field"><label>Age</label><input id="pAge" type="number"></div><div class="field"><label>Gender</label><input id="pGender"></div><div class="field"><label>Blood group</label><select id="pbg">${opts(['O+','A+','B+','AB+','O-','A-','B-','AB-'])}</select></div><div class="field"><label>Required organ</label><select id="pOrg">${opts(organs)}</select></div><div class="field"><label>Urgency</label><select id="pUrg">${opts(urgency)}</select></div></div><div class="form-grid five">${['a','b','c','dr','dq'].map(x=>`<div class="field"><label>HLA-${x.toUpperCase()}</label><input id="ph${x}"></div>`).join('')}</div><button class="btn primary">Create patient</button></form>`}function pt(ps){return`<div class="glass card table-wrap"><table class="table"><thead><tr><th>Name</th><th>Organ</th><th>Blood</th><th>Urgency</th><th>Priority</th><th>Status</th><th></th></tr></thead><tbody>${ps.map(p=>`<tr><td>${esc(p.full_name)}</td><td>${esc(p.required_organ)}</td><td>${esc(p.blood_group)}</td><td>${esc(p.urgency)}</td><td>${Number(p.priority_score||0).toFixed(1)}</td><td>${esc(p.waitlist_status)}</td><td><button class="btn" onclick="go('doctor/matching');setTimeout(()=>matchPatient.value='${p.id}',200)">Match</button></td></tr>`).join('')}</tbody></table></div>`}function dt(ds){return`<table class="table"><thead><tr><th>ID</th><th>Blood</th><th>Organs</th><th>HLA</th><th>Status</th></tr></thead><tbody>${ds.map(d=>`<tr><td class="mono">${esc(d.id).slice(0,10)}</td><td>${esc(d.blood_group)}</td><td>${esc((d.organs_available||[]).join(', '))}</td><td>${esc([d.hla_a,d.hla_b,d.hla_c,d.hla_dr,d.hla_dq].filter(Boolean).join(' · '))}</td><td>${esc(d.availability_status)}</td></tr>`).join('')}</tbody></table>`}async function docSave(e){e.preventDefault();await act(async()=>{await api('/api/v1/doctors/me',{method:'PUT',body:JSON.stringify({phone:dp.value,address:da.value,license_number:dl.value,specialty:ds.value,hospital_id:dh.value||null})});toast('Saved')})}async function patientCreate(e){e.preventDefault();await act(async()=>{await api('/api/v1/patients',{method:'POST',body:JSON.stringify({full_name:pn.value,age:pAge.value?+pAge.value:null,gender:pGender.value,blood_group:pbg.value,required_organ:pOrg.value.toLowerCase(),urgency:pUrg.value,hla_a:pha.value,hla_b:phb.value,hla_c:phc.value,hla_dr:phdr.value,hla_dq:phdq.value})});toast('Patient created');go('doctor/patients')})}async function matchRun(){await act(async()=>{const d=await api('/api/v1/matching/run/'+matchPatient.value,{method:'POST'});matchResults.innerHTML=`<div class="glass card"><div class="eyebrow">${d.candidates_evaluated} CANDIDATES EVALUATED</div><div class="table-wrap"><table class="table"><thead><tr><th>Rank</th><th>Donor</th><th>Score</th><th>Blood</th><th>HLA</th><th>Organ</th><th>Urgency</th><th>Explanation</th></tr></thead><tbody>${(d.matches||[]).map(m=>`<tr><td>#${m.rank}</td><td class="mono">${esc(m.donor_id).slice(0,10)}</td><td>${m.score}/100</td><td>${m.blood_compatible?'PASS':'FAIL'}</td><td>${m.hla_score}%</td><td>${m.organ_compatible?'PASS':'FAIL'}</td><td>${esc(m.urgency)}</td><td>${esc(m.explanation||'Compatibility factors evaluated')}</td></tr>`).join('')}</tbody></table></div></div>`})}async function bench(){await act(async()=>{const d=await api('/api/v1/quantum/benchmark');benchOut.innerHTML=`<div class="table-wrap" style="margin-top:12px"><table class="table"><thead><tr><th>Pool</th><th>Classical</th><th>Quantum-inspired</th><th>Reduction</th><th>Same optimum</th></tr></thead><tbody>${d.benchmark.map(x=>`<tr><td>${x.pool_size}</td><td>${x.classical_evals}</td><td>${x.quantum_evals}</td><td>${x.reduction_pct}%</td><td>${x.same_optimum?'YES':'NO'}</td></tr>`).join('')}</tbody></table></div>`})}function emergency(){return`${head('EMERGENCY NETWORK','Emergency coordination','Create and track emergency requests through the authenticated backend.','<button class="btn danger" onclick="emCreate()">🚨 Create emergency</button>')}<div class="glass card"><div class="notice warn">Emergency actions notify authorized users. ESP32 remains an authenticated physical interface.</div><div id="emList" style="margin-top:14px">Loading…</div></div>`}async function emCreate(){const requirement=prompt('Requirement (organ / urgency)');if(!requirement)return;await act(async()=>{await api('/api/v1/emergency/create',{method:'POST',body:JSON.stringify({requirement})});toast('Emergency created');emLoad()})}async function emLoad(){const d=await api('/api/v1/emergency');emList.innerHTML=d.length?d.map(x=>`<div class="step ${x.status==='NOTIFIED'?'on':''}" style="margin-bottom:8px"><span class="badge b-red">${esc(x.status)}</span><b>${esc(x.requirement)}</b><span class="muted">${esc(x.created_at)}</span></div>`).join(''):'<p class="sub">No emergency requests.</p>'}async function hospital(p){if(p==='hospital/profile'){const d=await api('/api/v1/hospitals/me');return`${head('HOSPITAL','Hospital profile','Verified hospital identity and contact information.')}<div class="glass card"><form class="form" onsubmit="hospitalSave(event)"><div class="form-grid"><div class="field"><label>Hospital name</label><input id="hn" value="${esc(d.hospital_name)}" required></div><div class="field"><label>Hospital code</label><input id="hcode" value="${esc(d.hospital_code)}" required></div><div class="field"><label>Phone</label><input id="hp" value="${esc(d.phone)}"></div><div class="field"><label>Address</label><input id="haddr" value="${esc(d.address)}"></div></div><div class="notice">Verification: ${esc(d.verification_status)}</div><button class="btn primary">Save</button></form></div>`}if(p==='hospital/doctors'){const ds=await api('/api/v1/doctors');return`${head('HOSPITAL','Associated doctors','Doctor records accessible to hospital users.')}<div class="glass card table-wrap"><table class="table"><thead><tr><th>ID</th><th>License</th><th>Specialty</th><th>Approval</th></tr></thead><tbody>${ds.map(d=>`<tr><td>${esc(d.id).slice(0,10)}</td><td>${esc(d.license_number)}</td><td>${esc(d.specialty)}</td><td>${esc(d.approval_status)}</td></tr>`).join('')}</tbody></table></div>`}if(p==='hospital/patients')return`${head('HOSPITAL','Patients','Patient access is controlled by backend authorization and case association.')}<div class="glass card"><p class="sub">Hospital patient management is intentionally restricted to authorized case data. Use the clinical doctor workflow to create recipient records.</p></div>`;if(p==='hospital/matching')return`${head('HOSPITAL','Match coordination','Hospital users can submit match requests through the backend matching service.')}<div class="glass card"><p class="sub">Select an authorized patient and run the same deterministic compatibility engine used by the clinical workflow.</p></div>`;if(p==='hospital/emergency')return emergency();return`${head('HOSPITAL PORTAL','Hospital coordination','Profile, associated doctors, patient cases, matching and emergency network.')}<div class="grid g3">${stat('Verification','Backend enforced','cyan')}${stat('Access','Role protected','green')}${stat('Emergency','Network ready','red')}</div>`}async function hospitalSave(e){e.preventDefault();await act(async()=>{await api('/api/v1/hospitals/me',{method:'PUT',body:JSON.stringify({hospital_name:hn.value,hospital_code:hcode.value,phone:hp.value,address:haddr.value})});toast('Saved')})}async function organizer(p){if(['organizer/doctors','organizer/approvals'].includes(p)){const ds=await api('/api/v1/organizer/doctors/pending');return`${head('ORGANIZER','Doctor approvals','Review pending doctors and approve or reject.')}<div class="glass card table-wrap"><table class="table"><thead><tr><th>ID</th><th>License</th><th>Specialty</th><th>Status</th><th>Actions</th></tr></thead><tbody>${ds.map(d=>`<tr><td>${esc(d.id).slice(0,10)}</td><td>${esc(d.license_number)}</td><td>${esc(d.specialty)}</td><td>${esc(d.approval_status)}</td><td><button class="btn primary" onclick="approve('${d.id}')">Approve</button> <button class="btn danger" onclick="reject('${d.id}')">Reject</button></td></tr>`).join('')}</tbody></table></div>`}if(p==='organizer/hospitals'){const hs=await api('/api/v1/hospitals');return`${head('ORGANIZER','Hospitals','Hospital verification registry.')}<div class="glass card table-wrap"><table class="table"><thead><tr><th>Name</th><th>Code</th><th>Status</th><th></th></tr></thead><tbody>${hs.map(h=>`<tr><td>${esc(h.hospital_name)}</td><td>${esc(h.hospital_code)}</td><td>${esc(h.verification_status)}</td><td>${h.verification_status!=='verified'?`<button class="btn" onclick="verify('${h.id}')">Verify</button>`:''}</td></tr>`).join('')}</tbody></table></div>`}if(p==='organizer/donors'){const ds=await api('/api/v1/donors/search');return`${head('ORGANIZER','Donor registry','Authorized structured donor pool.')}<div class="glass card table-wrap">${dt(ds)}</div>`}if(p==='organizer/audit'){const a=await api('/api/v1/organizer/audit-log');return`${head('ORGANIZER','Audit log','Important operational actions recorded by the backend.')}<div class="glass card table-wrap"><table class="table"><thead><tr><th>Action</th><th>Target</th><th>Timestamp</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.action)}</td><td>${esc(x.target)}</td><td>${esc(x.created_at)}</td></tr>`).join('')}</tbody></table></div>`}if(p==='organizer/emergency')return emergency();if(p==='organizer/devices'){const ds=await api('/api/v1/devices');return`${head('ORGANIZER','ESP32 devices','Authenticated device status and last-seen information.')}<div class="glass card table-wrap"><table class="table"><thead><tr><th>Device</th><th>Hospital</th><th>Firmware</th><th>Status</th><th>Last seen</th></tr></thead><tbody>${ds.map(d=>`<tr><td class="mono">${esc(d.id).slice(0,10)}</td><td>${esc(d.hospital_id).slice(0,10)}</td><td>${esc(d.firmware_version)}</td><td>${esc(d.connection_status)}</td><td>${esc(d.last_seen)}</td></tr>`).join('')}</tbody></table></div>`}if(p==='organizer/users'||p==='organizer/patients'||p==='organizer/matches')return`${head('ORGANIZER','Operational oversight','Use role-specific records and audited backend workflows.')}<div class="glass card"><p class="sub">This view intentionally avoids invented records or fake actions. Available backend endpoints remain the source of truth.</p></div>`;const s=await api('/api/v1/organizer/stats');return`${head('ORGANIZER','Central operations','Approvals, monitoring, coordination and audit.')}<div class="grid g4">${stat('Total donors',s.total_donors)}${stat('Active donors',s.active_donors,'green')}${stat('Recipients',s.total_recipients,'amber')}${stat('Active cases',s.active_cases,'red')}${stat('Hospitals',s.registered_hospitals)}${stat('Approved doctors',s.approved_doctors,'green')}${stat('Pending doctors',s.pending_doctors,'amber')}${stat('Completed cases',s.completed_cases,'green')}</div>`}async function approve(id){await act(async()=>{await api('/api/v1/organizer/doctors/'+id+'/approve',{method:'POST'});toast('Approved');go('organizer/approvals')})}async function reject(id){const reason=prompt('Reason (optional)')||'';await act(async()=>{await api('/api/v1/organizer/doctors/'+id+'/reject?reason='+encodeURIComponent(reason),{method:'POST'});toast('Rejected');go('organizer/approvals')})}async function verify(id){await act(async()=>{await api('/api/v1/organizer/hospitals/'+id+'/verify',{method:'POST'});toast('Verified');go('organizer/hospitals')})}window.addEventListener('hashchange',()=>{state.path=location.hash.slice(1)||'login';render()});if(state.token){document.getElementById('root').innerHTML='<div class="login"><div class="glass login-card" style="max-width:460px;text-align:center"><div class="brand" style="justify-content:center"><span class="dot"></span>Q-TRANSPLANT</div><p class="sub">Connecting to server…</p></div></div>';api('/api/v1/auth/me').then(u=>{state.user=u;state.role=u.role;render()}).catch(e=>{toast(e.message);logout()})}else render();</script></body></html>
